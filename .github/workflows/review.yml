# Posts the review report that Validate wrote for a pull request. Validate runs the pull request's
# code without any write permission; this workflow has permission to comment but never checks out
# or runs anything from the pull request. The report is treated as text only.
name: Review comment

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    name: Wingbot review comment
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wingbot-review
          path: review
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(head -c 10 review/pr.txt | tr -cd '0-9')
          test -n "$pr"
          # The number comes from the pull request's own run: accept it only if that pull request
          # really is at the commit Validate checked.
          test "$(gh api "repos/$REPO/pulls/$pr" -q .head.sha)" = "$HEAD_SHA"
          head -c 60000 review/report.md > body.md
          id=$(gh api "repos/$REPO/issues/$pr/comments" --paginate \
            -q '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- wingbot-review -->"))) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$pr/comments" -F body=@body.md > /dev/null
          fi
