# Checks every registry entry and the adapter it points at. Runs on pull requests, including
# pull requests from forks, so it gets no secret that can write to the repository or sign.
name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Registry checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false # nothing to cache: the tools use only jsonschema
      - name: Install rsvg-convert
        run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
      - name: Tooling tests
        run: uv run --python 3.12 --with jsonschema python -m unittest discover -s tests
      - name: Last published index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern index.json --dir previous 2>/dev/null \
            || echo "No published index yet"
      - name: Entries and adapters
        run: |
          cd tools
          uv run --python 3.12 --with jsonschema python -m wingreg validate --previous ../previous/index.json
      - name: Review report
        if: always() && github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p review
          cd tools
          uv run --python 3.12 --with jsonschema python -m wingreg report --previous ../previous/index.json --out ../review/report.md
          echo "$PR_NUMBER" > ../review/pr.txt
      - name: Keep the report for the comment workflow
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wingbot-review
          path: review/
          retention-days: 7

  adapter-tests:
    name: Official adapter tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false # nothing to cache: the tools use only jsonschema
      - name: Run each adapter's tests
        shell: bash
        run: |
          status=0
          for tests in adapters/*/tests; do
            [ -d "$tests" ] || continue
            echo "::group::${tests%/tests}"
            uv run --no-project --python "${{ matrix.python }}" python -m unittest discover -s "$tests" -t "$tests" || status=1
            echo "::endgroup::"
          done
          exit $status
