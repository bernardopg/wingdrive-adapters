[adapter]
id = "obsidian"
name = "Obsidian"
summary = "Search your Obsidian vault: notes with their tags, aliases and the links between them."
description = """
Reads every Markdown note in an Obsidian vault, or any folder of Markdown files. Each note keeps \
its frontmatter tags and aliases, inline #tags, folder, dates and word count, and links to the \
notes it points at through [[wikilinks]] or Markdown links. Syncs read only the notes that \
changed and remove the ones you deleted. Nothing leaves your computer.\
"""
version = "1.1.2"
author = "WingDrive"
license = "Apache-2.0"
homepage = "https://github.com/bernardopg/wingdrive-adapters/tree/main/adapters/obsidian"
icon = "icon.svg"
contract = 1
platforms = ["linux", "macos", "windows"]
categories = ["notes"]

[adapter.i18n.pt]
summary = "Busque no seu cofre do Obsidian: notas com tags, aliases e os links entre elas."
description = """
Lê todas as notas Markdown de um cofre do Obsidian, ou de qualquer pasta de arquivos Markdown. Cada nota guarda as tags e os aliases do frontmatter, as #tags no texto, a pasta, as datas e a contagem de palavras, e se liga às notas que cita por [[wikilinks]] ou links Markdown. As sincronizações leem só as notas que mudaram e removem as que você apagou. Nada sai do seu computador.
"""

[adapter.i18n.pt.config.vault_path]
name = "Cofre"
description = "A pasta do seu cofre do Obsidian, ou qualquer pasta de notas Markdown. Os cofres que o Obsidian conhece aparecem como opção."

[adapter.i18n.pt.config.exclude_patterns]
name = "Ignorar"
description = "Pastas ou arquivos que ficam de fora, separados por vírgula (por exemplo: Templates, Arquivo/*, *.excalidraw.md)."

[adapter.runtime]
kind = "python3"
entry = "sync.py"
python = "3.9"
timeout = 600
schedule = "*/15 * * * *"
detect = true

[adapter.permissions]
read = [
  "{config.vault_path}",
  "~/.config/obsidian/obsidian.json",
  "~/.var/app/md.obsidian.Obsidian/config/obsidian/obsidian.json",
  "~/snap/obsidian/current/.config/obsidian/obsidian.json",
  "~/Library/Application Support/obsidian/obsidian.json",
]

[[adapter.config]]
key = "vault_path"
name = "Vault"
description = "The folder of your Obsidian vault, or any folder of Markdown notes. The vaults Obsidian knows are offered."
type = "string"
path_type = "folder"
required = true

[[adapter.config]]
key = "exclude_patterns"
name = "Skip"
description = "Folders or files to leave out, separated by commas (for example: Templates, Archive/*, *.excalidraw.md)."
type = "string"
required = false

[data_type]
id = "obsidian"
name = "Obsidian note"
icon = "note"

[models.note]
fields.title = "string"
fields.body = "text"
fields.path = "string"
fields.folder = "string"
fields.tags = "string"
fields.aliases = "string"
fields.created = "datetime"
fields.modified = "datetime"
fields.word_count = "integer"

[models.note.relations]
many_to_many = ["note"]

[search]
primary_model = "note"
title = "title"
preview = "body"
subtitle = "path"
search_fields = ["title", "body", "tags", "aliases"]
date_field = "modified"
