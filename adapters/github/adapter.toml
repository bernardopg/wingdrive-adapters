[adapter]
id = "github"
name = "GitHub"
summary = "Search your GitHub repositories, stars, issues and pull requests next to your files."
description = """
Indexes a GitHub account: the repositories it owns and starred, and with a token the issues and \
pull requests it opened, was assigned or mentioned in, including private ones the token can see. \
Each sync asks GitHub only for what changed since the last one, and drops repositories you \
deleted or unstarred. Read only: it never changes anything on GitHub.\
"""
version = "1.0.3"
author = "WingDrive"
license = "Apache-2.0"
homepage = "https://github.com/bernardopg/wingdrive-adapters/tree/main/adapters/github"
icon = "icon.svg"
contract = 1
platforms = ["linux", "macos", "windows"]
categories = ["code"]

[adapter.i18n.pt]
summary = "Busque seus repositórios, estrelas, issues e pull requests do GitHub junto com seus arquivos."
description = """
Indexa uma conta do GitHub: os repositórios dela e os que ela marcou com estrela e, com um token, as issues e os pull requests de que ela participa, inclusive os privados que o token alcança. Cada sincronização pede ao GitHub só o que mudou desde a anterior e remove repositórios apagados ou sem estrela. Só leitura: nunca altera nada no GitHub.
"""

[adapter.i18n.pt.config.username]
name = "Usuário do GitHub"
description = "Seu nome de usuário no GitHub. Vem preenchido quando o GitHub CLI está conectado neste computador."

[adapter.i18n.pt.config.token]
name = "Token de acesso"
description = "Opcional. Um token fine-grained com leitura de metadados e issues (ou um token clássico com o escopo repo) inclui repositórios privados, issues e pull requests. Sem ele, só repositórios públicos e estrelas são indexados."

[adapter.i18n.pt.config.include_starred]
name = "Repositórios com estrela"
description = "Indexar os repositórios em que você deu estrela."

[adapter.i18n.pt.config.include_issues]
name = "Issues e pull requests"
description = "Com um token, indexar as issues e os pull requests de que você participa."

[adapter.runtime]
kind = "python3"
entry = "sync.py"
python = "3.9"
timeout = 900
schedule = "0 * * * *"
detect = true

[adapter.permissions]
read = ["~/.config/gh/hosts.yml"]
network = ["api.github.com"]
secrets = ["token"]

[[adapter.config]]
key = "username"
name = "GitHub user"
description = "Your GitHub user name. Filled in when the GitHub CLI is signed in on this computer."
type = "string"
required = true

[[adapter.config]]
key = "token"
name = "Access token"
description = "Optional. A fine-grained token with read access to metadata and issues (or a classic token with the repo scope) adds private repositories, issues and pull requests. Without it only public repositories and stars are indexed."
type = "string"
secret = true
required = false

[[adapter.config]]
key = "include_starred"
name = "Starred repositories"
description = "Index the repositories you starred (true or false)."
type = "boolean"
default = true
required = false

[[adapter.config]]
key = "include_issues"
name = "Issues and pull requests"
description = "With a token, index the issues and pull requests you take part in (true or false)."
type = "boolean"
default = true
required = false

[data_type]
id = "github"
name = "GitHub item"
icon = "code"

[models.item]
fields.kind = "string"
fields.title = "string"
fields.body = "text"
fields.repo = "string"
fields.number = "integer"
fields.state = "string"
fields.author = "string"
fields.labels = "string"
fields.relation = "string"
fields.url = "string"
fields.created = "datetime"
fields.updated = "datetime"

[search]
primary_model = "item"
title = "title"
preview = "body"
subtitle = "repo"
search_fields = ["title", "body", "repo", "labels", "author"]
date_field = "updated"
