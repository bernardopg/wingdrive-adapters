[adapter]
id = "coding-sessions"
name = "Coding agent sessions"
summary = "Search your Claude Code, Codex and OpenCode sessions: what you asked, what the agent answered, tools and files."
description = """
Reads the sessions that Claude Code, Codex and OpenCode keep on this computer. Each session keeps \
its title, a short summary, project folder, branch, dates, the tools the agent used, the files it \
edited, and the full text of your prompts and of the agent's answers. Tool output and the model's \
reasoning are left out, and tokens, keys and passwords found in the text are replaced before \
anything is stored. Syncs read only what was added since the last one and remove the sessions you \
deleted. Nothing leaves your computer.\
"""
version = "0.2.0"
author = "WingDrive"
license = "Apache-2.0"
homepage = "https://github.com/bernardopg/wingdrive-adapters/tree/main/adapters/coding-sessions"
icon = "icon.svg"
contract = 1
platforms = ["linux", "macos", "windows"]
categories = ["code"]

[adapter.i18n.pt]
summary = "Busque nas suas sessões do Claude Code, Codex e OpenCode: o que você pediu, o que o agente respondeu, ferramentas e arquivos."
description = """
Lê as sessões que o Claude Code, o Codex e o OpenCode guardam neste computador. Cada sessão guarda o título, um resumo curto, a pasta do projeto, o branch, as datas, as ferramentas que o agente usou, os arquivos que editou e o texto completo dos seus pedidos e das respostas do agente. A saída das ferramentas e o raciocínio do modelo ficam de fora, e tokens, chaves e senhas encontrados no texto são substituídos antes de qualquer coisa ser guardada. As sincronizações leem só o que foi acrescentado desde a última e removem as sessões que você apagou. Nada sai do seu computador.
"""

[adapter.i18n.pt.config.claude_dir]
name = "Pasta do Claude Code"
description = "Onde o Claude Code guarda as sessões. Deixe vazio para usar ~/.claude/projects."

[adapter.i18n.pt.config.codex_dir]
name = "Pasta do Codex"
description = "Onde o Codex guarda as sessões. Deixe vazio para usar ~/.codex/sessions."

[adapter.i18n.pt.config.opencode_db]
name = "Banco do OpenCode"
description = "O arquivo opencode.db do OpenCode. Deixe vazio para usar ~/.local/share/opencode/opencode.db."

[adapter.runtime]
kind = "python3"
entry = "sync.py"
python = "3.9"
timeout = 1800
schedule = "*/30 * * * *"
detect = true

[adapter.permissions]
read = [
  "{config.claude_dir}",
  "{config.codex_dir}",
  "{config.opencode_db}",
  "{config.opencode_db}-wal",
  "{config.opencode_db}-shm",
  "~/.claude/projects",
  "~/.codex/sessions",
  "~/.local/share/opencode/opencode.db",
  "~/.local/share/opencode/opencode.db-wal",
  "~/.local/share/opencode/opencode.db-shm",
]

[[adapter.config]]
key = "claude_dir"
name = "Claude Code folder"
description = "Where Claude Code keeps its sessions. Leave empty for ~/.claude/projects."
type = "string"
path_type = "folder"

[[adapter.config]]
key = "codex_dir"
name = "Codex folder"
description = "Where Codex keeps its sessions. Leave empty for ~/.codex/sessions."
type = "string"
path_type = "folder"

[[adapter.config]]
key = "opencode_db"
name = "OpenCode database"
description = "OpenCode's opencode.db file. Leave empty for ~/.local/share/opencode/opencode.db."
type = "string"
path_type = "file"

[data_type]
id = "coding-sessions"
name = "Coding agent sessions"

[models.session]
fields.title = "string"
fields.summary = "text"
fields.body = "text"
fields.agent = "string"
fields.project = "string"
fields.branch = "string"
fields.started = "datetime"
fields.updated = "datetime"
fields.prompts = "integer"
fields.tools = "string"
fields.files = "string"

[models.session.relations]
many_to_many = ["tool", "file"]

[models.tool]
fields.name = "string"

[models.file]
fields.path = "string"
fields.name = "string"

[search]
primary_model = "session"
title = "title"
preview = "summary"
subtitle = "project"
search_fields = ["title", "body", "project", "files"]
date_field = "updated"
